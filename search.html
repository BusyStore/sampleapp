<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .search-box { margin-bottom: 25px; display: flex; gap: 10px; }
        .search-input { flex: 1; padding: 12px; background: var(--card-bg); border: 1px solid var(--border-color); color: white; border-radius: 6px; }
    </style>
</head>
<body>
    <nav class="sidebar">
        <div class="brand">
            <span><i class="fa-solid fa-play-circle"></i> My Hub</span>
            <button class="close-btn" onclick="toggleSidebar()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <ul class="menu-list">
            <li class="menu-item"><a href="index.html"><i class="fa-solid fa-fire"></i> Latest</a></li>
            <li class="menu-item"><a href="index.html?sort=popular"><i class="fa-solid fa-chart-line"></i> Popular</a></li>
            <li class="menu-item"><a href="category.html"><i class="fa-solid fa-hashtag"></i> Category</a></li>
            <li class="menu-item"><a href="model.html"><i class="fa-solid fa-user-star"></i> Model</a></li>
            <li class="menu-item active"><a href="search.html"><i class="fa-solid fa-magnifying-glass"></i> Search</a></li>
            <li class="menu-item"><a href="login.html"><i class="fa-solid fa-right-to-bracket"></i> Login</a></li>
            <li class="menu-item"><a href="javascript:void(0)" onclick="checkVipAccess()"><i class="fa-solid fa-crown"></i> VIP Zone</a></li>
        </ul>
    </nav>

    <main class="main-content" id="mainContent">
        <div class="header">
            <button class="toggle-btn" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
            <h1>Search Videos</h1>
        </div>

        <div class="search-box">
            <input type="text" id="searchInput" class="search-input" placeholder="Title, Model နာမည် သို့မဟုတ် #Tag ဖြင့် ရှာရန်..." oninput="handleSearch()">
        </div>

        <div class="video-grid" id="searchResultContainer"></div>
    </main>
    
            <script src="js/app.js"></script>
    <script>
        function handleSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const container = document.getElementById('searchResultContainer');
            container.innerHTML = '';

            if (!query) return;

            // ဗီဒီယို ဒေတာများထဲမှ file_id ရှိပြီး VIP မဟုတ်သည်များကို စစ်ထုတ်မည်
            const publicVideos = videoData.filter(v => v.file_id && v.file_id.trim() !== '' && !v.isVip);
            
            const results = publicVideos.filter(video => {
                const title = (video.title || '').toLowerCase();
                
                // Model နာမည်များကို comma ခွဲ၍ စစ်ဆေးရန်
                const modelStr = (video.model_name || video.model || '').toLowerCase();
                const models = modelStr.split(',').map(m => m.trim());
                const matchModel = models.some(m => m.includes(query));

                // Category နာမည်များကို comma ခွဲ၍ စစ်ဆေးရန်
                const catStr = (video.category || video.category_name || '').toLowerCase();
                const cats = catStr.split(',').map(c => c.trim());
                const matchCat = cats.some(c => c.includes(query));

                // Title, Model သို့မဟုတ် Category ထဲတွင် ရှာသောစာသား ပါဝင်ခြင်း ရှိမစစ်ဆေးရန်
                return title.includes(query) || matchModel || matchCat;
            });

            if (results.length === 0) {
                container.innerHTML = '<p class="empty-msg" style="color:#888; text-align:center; padding:40px; grid-column: 1/-1;">Search not Found.</p>';
                return;
            }

            results.forEach(video => {
                container.innerHTML += `
                    <div class="video-card" onclick="openPlayer('${video.file_id}', '${video.stream_url}')" style="cursor:pointer; background:#1a1a24; border-radius:10px; overflow:hidden; border:1px solid #282836; display:flex; flex-direction:column;">
                        <div class="thumbnail-box" style="position:relative; width:100%; height:150px; background:#000; overflow:hidden;">
                            <video src="${video.thumbnail || ''}" alt="${video.title || ''}" style="width:100%; height:100%; object-fit:cover; display:block;" onerror="this.onerror=null; this.src='https://via.placeholder.com/300x180';">
                            <span class="view-badge" style="position:absolute; bottom:5px; right:5px; background:rgba(0,0,0,0.7); color:#fff; font-size:11px; padding:2px 6px; border-radius:4px; z-index:2;">
                                <i class="fa-solid fa-eye"></i> ${video.views || 0}
                            </span>
                        </div>
                        <div class="video-info" style="padding: 8px 10px;">
                            <h3 style="font-size: 14px; margin: 0; color: #fff; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${video.title || ''}</h3>
                        </div>
                    </div>
                `;
            });
        }
    </script>

</body>
</html>
